        </div>

        <div id="mainApp" class="hidden">
            <div class="card balance">
                <p>Hi <span id="userPhone"></span></p>
                <h1>K<span id="balance">0.00</span></h1>
                <p><span id="points">0</span> Points | 100 points = K1</p>
            </div>

            <div class="card">
                <button id="watchAdBtn" class="btn btn-green" onclick="watchAd()">▶ Watch Ad +10 Points</button>
            </div>

            <div class="card">
                <h3>Daily Tasks</h3>
                <div id="taskList"></div>

            <div class="card">
                <h3>Cash Out Min K5.00</h3>
                <p style="font-size: 14px; color: #6b7280; margin-bottom: 10px;">Money sent to: <span id="cashoutPhone"></span></p>
                <button id="cashoutBtn" class="btn btn-orange" onclick="requestCashout()" disabled>Request Cashout</button>
                <div id="cashoutStatus" style="margin-top: 10px; font-size: 14px;"></div>
            </div>

            <div class="footer">
                <p>No deposits needed. We pay you from ad revenue.</p>
                <button style="background:none; border:none; color:#ea580c; margin-top:10px;" onclick="logout()">Logout</button>
            </div>
        </div>

<script>
    const API_URL = 'https://your-backend-url.com'; // Change this after deploying backend
    let token = localStorage.getItem('token');
    let user = null;

    if (token) showApp();

    async function login() {
        const phone = document.getElementById('loginPhone').value;
        if (phone.length!== 10) return alert('Enter valid 10-digit Zambian number');

        const res = await fetch(`${API_URL}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone })
        });
        const data = await res.json();
        token = data.token;
        localStorage.setItem('token', token);
        showApp();
    }

    async function showApp() {
        const res = await fetch(`${API_URL}/me`, {
            headers: { 'Authorization': token }
        });
        if (!res.ok) return logout();
        user = await res.json();

        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        document.getElementById('userPhone').textContent = user.phone;
        document.getElementById('cashoutPhone').textContent = user.phone;
        updateUI();
        loadTasks();
    }

    function updateUI() {
        document.getElementById('points').textContent = user.points;
        document.getElementById('balance').textContent = (user.points / 100).toFixed(2);
        document.getElementById('cashoutBtn').disabled = user.points < 500;
        document.getElementById('cashoutStatus').textContent = user.pendingCashout?
            `Pending: K${(user.pendingCashout / 100).toFixed(2)} - Processing` : '';
    }

    async function watchAd() {
        // Replace with real AdSense rewarded ad code after approval
        // For now we simulate it
        document.getElementById('watchAdBtn').disabled = true;
        document.getElementById('watchAdBtn').textContent = 'Loading Ad...';

        setTimeout(async () => {
            const res = await fetch(`${API_URL}/reward/ad`, {
                method: 'POST',
                headers: { 'Authorization': token }
            });
            user = await res.json();
            updateUI();
            document.getElementById('watchAdBtn').disabled = false;
            document.getElementById('watchAdBtn').textContent = '▶ Watch Ad +10 Points';
        }, 3000);
    }

    async function loadTasks() {
        const res = await fetch(`${API_URL}/tasks`, { headers: { 'Authorization': token } });
        const tasks = await res.json();
        const taskList = document.getElementById('taskList');
        taskList.innerHTML = '';
        tasks.forEach(t => {
            taskList.innerHTML += `
                <div class="task">
                    <span>${t.title}</span>
                    ${t.done? '<span style="color:#16a34a">✓ Done</span>' :
                    `<button class="btn" style="width:auto; padding:8px 16px;" onclick="completeTask('${t.id}')">${t.points}</button>`}
                </div>`;
        });
    }

    async function completeTask(taskId) {
        const res = await fetch(`${API_URL}/reward/task`, {
            method: 'POST',
            headers: { 'Authorization': token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ taskId })
        });
        user = await res.json();
        updateUI();
        loadTasks();
    }

    async function requestCashout() {
        if (user.points < 500) return;
        const res = await fetch(`${API_URL}/cashout`, {
            method: 'POST',
            headers: { 'Authorization': token }
        });
        user = await res.json();
        updateUI();
    }

    function logout() {
        localStorage.removeItem('token');
        location.reload();
    }
</script>
